# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y

# Bluetooth: max TX power on the nRF52840 (default is 0 dBm).
# ZMK docs note the extra power draw is negligible.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Connection-stability settings slated to become ZMK defaults.
# Currently disables 2M PHY, which fixes stutter/dropouts on Windows
# and older Intel Macs.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Power saving. Idle blanks the OLED but keeps BLE connected; deep sleep
# disconnects BLE and powers down peripherals, costing a few seconds to
# reconnect on the next keypress.
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Mouse / pointer support (mmv, mkp, msc on the Nav layer).
CONFIG_ZMK_POINTING=y
